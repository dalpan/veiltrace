<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Parcelo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d2330;background:#f4f5f7;line-height:1.55;font-size:15px}
a{color:inherit}
img,svg{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.muted{color:#6b7280}
.small{font-size:13px}
.btn{display:inline-block;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:18px}
footer.site{margin-top:40px;padding:28px 0;background:#1f2430;color:#b8bec9;font-size:13px}
footer.site a{color:#d7dbe2;text-decoration:none;margin-right:14px}
@media(max-width:760px){.grid2,.grid3{display:block!important}.side{margin-top:20px}}


body{background:#f2f4f8}.box{max-width:400px;margin:60px auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #cdd2da;border-radius:6px;font-size:14px}
.cap{display:flex;align-items:center;justify-content:space-between;border:1px solid #d3d3d3;background:#f9f9f9;border-radius:3px;padding:12px;margin:18px 0}
.cap .l{display:flex;gap:10px;align-items:center}.cap .cb{width:24px;height:24px;border:2px solid #c1c1c1;border-radius:2px;background:#fff}
.cap .r{font-size:10px;color:#555;text-align:center}.btn-p{background:#ea580c;color:#fff;width:100%}

</style>
</head>
<body>

<div class="box">
<div style="display:flex;gap:10px;align-items:center"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#ea580c"/><text x="16" y="21.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Arial" fill="#fff">P</text></svg><b style="font-size:20px">Parcelo</b></div>
<h2 style="margin-bottom:4px">Sign in</h2><p class="small muted" style="margin-top:0">Track shipments and manage your deliveries.</p>
<form onsubmit="return false"><label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<div class="cap"><div class="l"><div class="cb" role="checkbox" aria-checked="false" tabindex="0"></div><span>I'm not a robot</span></div><div class="r">&#8635;<br>HumanCheck<br>Privacy - Terms</div></div>
<button class="btn btn-p">Sign in</button></form>
<p class="small muted">Too many failed attempts trigger an image challenge. <a href="#">Forgot password?</a></p>
</div>
<p class="small muted" style="text-align:center">&copy; 2026 Parcelo Logistics</p>
</body>
</html>
