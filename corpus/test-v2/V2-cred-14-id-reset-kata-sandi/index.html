<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buat Kata Sandi Baru - MakanYuk</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d2330;background:#f4f5f7;line-height:1.55;font-size:15px}
a{color:inherit}
img,svg{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.muted{color:#6b7280}
.small{font-size:13px}
.btn{display:inline-block;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:18px}
footer.site{margin-top:40px;padding:28px 0;background:#1f2430;color:#b8bec9;font-size:13px}
footer.site a{color:#d7dbe2;text-decoration:none;margin-right:14px}
@media(max-width:760px){.grid2,.grid3{display:block!important}.side{margin-top:20px}}


body{background:#fff7ed}.box{max-width:420px;margin:50px auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
label{display:block;font-size:13px;font-weight:600;margin-top:12px}input{width:100%;padding:10px;border:1px solid #fed7aa;border-radius:6px;margin-top:4px}
.btn-o{background:#ea580c;color:#fff;width:100%;margin-top:18px}.rules{font-size:12px;color:#6b7280;margin:8px 0 0;padding-left:18px}

</style>
</head>
<body>

<div class="box">
<div style="display:flex;gap:10px;align-items:center"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#ea580c"/><text x="16" y="21.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Arial" fill="#fff">M</text></svg><b style="font-size:20px">MakanYuk</b></div>
<h2>Buat kata sandi baru</h2>
<p class="small muted">Untuk akun <b>r***a@surel.test</b>. Tautan ini berlaku 30 menit sejak dikirim.</p>
<form onsubmit="return false"><label for="p1">Kata sandi baru</label><input id="p1" type="password" autocomplete="new-password">
<ul class="rules"><li>Minimal 10 karakter</li><li>Kombinasi huruf dan angka</li><li>Berbeda dari 3 kata sandi terakhir</li></ul>
<label for="p2">Ulangi kata sandi baru</label><input id="p2" type="password" autocomplete="new-password">
<button class="btn btn-o">Simpan kata sandi</button></form>
<p class="small muted">Tidak merasa meminta reset? Abaikan email tersebut, kata sandi lama Anda tetap berlaku.</p>
</div>
</body>
</html>
