<body>
<div class="wrap"><article><h1>Memperbaiki error izin akses</h1>
<p>Pesan ini muncul jika folder cache dimiliki pengguna lain.</p>
<p>Perbaiki error ini dengan langkah berikut: buka Terminal, tempel perintah di bawah, lalu tekan Enter.</p>
<pre><code>sudo chown -R $(whoami) ~/.cache/alat-contoh</code></pre>
<p>Setelah itu jalankan ulang build.</p></article></div>
