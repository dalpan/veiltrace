<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Transaksi · Bank Nusantara</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1f2328;background:#f6f7f9}.bh{background:#004a8f;color:#fff;padding:14px 28px;display:flex;justify-content:space-between}.bh b{font-size:20px}.bx{max-width:460px;margin:50px auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.otp{display:flex;gap:10px;margin:16px 0}.otp input{width:48px;height:56px;text-align:center;font-size:22px;border:1px solid #c5cdd8;border-radius:8px}.note{font-size:13px;color:#5b6b7d;line-height:1.6}.ok{width:100%;background:#004a8f;color:#fff;border:0;border-radius:8px;padding:12px;font-weight:700}</style></head>
<body>
<div class="bh"><b>Bank Nusantara</b><span>Internet Banking</span></div><form class="bx" action="/otp" method="post"><h2>Verifikasi transaksi</h2><p class="note">Masukkan 6 digit kode OTP yang dikirim melalui SMS ke nomor terdaftar Anda. Kode berlaku 3 menit.</p><div class="otp"><input aria-label="Digit 1" inputmode="numeric" maxlength="1"><input aria-label="Digit 2" inputmode="numeric" maxlength="1"><input aria-label="Digit 3" inputmode="numeric" maxlength="1"><input aria-label="Digit 4" inputmode="numeric" maxlength="1"><input aria-label="Digit 5" inputmode="numeric" maxlength="1"><input aria-label="Digit 6" inputmode="numeric" maxlength="1"></div><p class="note">Jangan pernah memberikan kode OTP kepada siapa pun, termasuk petugas Bank Nusantara.</p><button class="ok" type="button">Konfirmasi</button></form>
</body></html>
