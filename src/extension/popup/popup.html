<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeilTrace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <header class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="var(--border-strong)" stroke-width="1"/>
      <path d="M5 16 A13.75 13.75 0 0 1 27 16 A13.75 13.75 0 0 1 5 16 Z" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.6" fill="var(--accent-text)"/>
      <circle cx="16" cy="16" r="1.4" fill="var(--bg)"/>
      <path d="M16 4V7.5M16 24.5V28" stroke="var(--accent-text)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <h1>VeilTrace</h1>
      <p id="tagline" class="tagline">Uncover the manipulation behind the page</p>
    </div>
    <div class="brand-meta">
      <span id="scan-state" class="state-chip" data-state="standby">STANDBY</span>
      <span id="version" class="version"></span>
    </div>
    <div class="lang" role="group" aria-labelledby="lang-label">
      <span id="lang-label" class="visually-hidden">Language</span>
      <button id="lang-en" type="button" class="lang-btn" lang="en" aria-pressed="true">EN</button>
      <button id="lang-id" type="button" class="lang-btn" lang="id" aria-pressed="false">ID</button>
    </div>
  </header>

  <main>
    <section class="target" aria-labelledby="target-label">
      <span id="target-label" class="target-label">Page</span>
      <span id="target-host" class="target-host">…</span>
    </section>

    <button id="scan" class="primary" type="button">Scan page</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" aria-live="polite" hidden></section>

    <section id="ai" class="ai" aria-labelledby="ai-title" hidden>
      <h2 id="ai-title" class="ai-title"></h2>
      <p id="ai-intro" class="ai-intro"></p>
      <button id="ai-prepare" class="show" type="button" hidden></button>
      <details id="ai-preview" class="ai-preview" hidden><summary id="ai-preview-summary"></summary><ol id="ai-lines" class="ai-payload"></ol></details>
      <button id="ai-run" class="show" type="button" hidden></button>
      <p id="ai-status" class="status" role="status" aria-live="polite"></p>
      <div id="ai-result" hidden></div>
    </section>
  </main>

  <footer>
    <details id="mode" class="mode" data-mode="manual">
      <summary><span id="mode-title">Scan mode</span> · <span id="mode-label" class="mode-chip">MANUAL</span></summary>
      <p id="mode-text"></p>
      <p id="mode-consent" class="mode-consent"></p>
      <button id="mode-toggle" class="show" type="button">Turn on automatic scanning</button>
      <p id="mode-status" class="mode-status" role="status" aria-live="polite"></p>
    </details>
    <details class="limits">
      <summary id="limits-summary">What VeilTrace can and cannot see</summary>
      <p id="limits"></p>
    </details>
    <p id="meta" class="meta">Runs on this device only. Nothing is sent anywhere.</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
