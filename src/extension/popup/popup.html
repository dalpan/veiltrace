<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeilTrace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <header class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--brand)"/>
      <path d="M5 16c3-5.5 7-8 11-8s8 2.5 11 8c-3 5.5-7 8-11 8s-8-2.5-11-8z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.6" fill="#fff"/>
      <path d="M7 25 25 7" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"/>
      <path d="M7.5 24.5 24.5 7.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.4 2.6"/>
    </svg>
    <div>
      <h1>VeilTrace</h1>
      <p class="tagline">Uncover the manipulation behind the page</p>
    </div>
  </header>

  <main>
    <section class="target" aria-label="Page to scan">
      <span class="target-label">Page</span>
      <span id="target-host" class="target-host">…</span>
    </section>

    <button id="scan" class="primary" type="button">Scan page</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" aria-label="Scan result" hidden></section>
  </main>

  <footer>
    <details class="limits">
      <summary>What VeilTrace can and cannot see</summary>
      <p id="limits"></p>
    </details>
    <p id="meta" class="meta">Runs on this device only. Nothing is sent anywhere.</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
